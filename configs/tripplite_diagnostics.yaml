# Read-only diagnostics for the descriptor-based 09AE:3024 driver.
substitutions:
  ups_name: UPS

sensor:
  - platform: ups_hid
    ups_hid_id: ups_monitor
    type: frequency
    name: "${ups_name} Input Frequency"
    entity_category: diagnostic
    state_class: measurement
  - platform: ups_hid
    ups_hid_id: ups_monitor
    type: output_frequency
    name: "${ups_name} Output Frequency"
    entity_category: diagnostic
    state_class: measurement
  - platform: ups_hid
    ups_hid_id: ups_monitor
    type: output_current
    name: "${ups_name} AC Output Current"
    entity_category: diagnostic
    state_class: measurement
  - platform: ups_hid
    ups_hid_id: ups_monitor
    type: output_voltage_nominal
    name: "${ups_name} Rated Output Voltage"
    entity_category: diagnostic
    state_class: measurement
  - platform: ups_hid
    ups_hid_id: ups_monitor
    type: output_frequency_nominal
    name: "${ups_name} Rated Output Frequency"
    entity_category: diagnostic
    state_class: measurement
  - platform: ups_hid
    ups_hid_id: ups_monitor
    type: ups_apparent_power_nominal
    name: "${ups_name} Rated Apparent Power"
    entity_category: diagnostic
    state_class: measurement
  - platform: ups_hid
    ups_hid_id: ups_monitor
    type: input_voltage_nominal
    name: "${ups_name} Rated Input Voltage"
    entity_category: diagnostic
    state_class: measurement
  - platform: ups_hid
    ups_hid_id: ups_monitor
    type: input_transfer_low
    name: "${ups_name} Low Transfer Voltage"
    entity_category: diagnostic
    state_class: measurement
  - platform: ups_hid
    ups_hid_id: ups_monitor
    type: input_transfer_high
    name: "${ups_name} High Transfer Voltage"
    entity_category: diagnostic
    state_class: measurement
  - platform: ups_hid
    ups_hid_id: ups_monitor
    type: battery_charge_warning
    name: "${ups_name} Battery Warning Threshold"
    entity_category: diagnostic
    state_class: measurement
  - platform: ups_hid
    ups_hid_id: ups_monitor
    type: ups_timer_shutdown
    name: "${ups_name} Shutdown Countdown"
    entity_category: diagnostic
    state_class: measurement
  - platform: ups_hid
    ups_hid_id: ups_monitor
    type: ups_timer_start
    name: "${ups_name} Startup Countdown"
    entity_category: diagnostic
    state_class: measurement
  - platform: ups_hid
    ups_hid_id: ups_monitor
    type: ups_timer_reboot
    name: "${ups_name} Reboot Countdown"
    entity_category: diagnostic
    state_class: measurement
  - platform: ups_hid
    ups_hid_id: ups_monitor
    type: ups_watchdog
    name: "${ups_name} Watchdog Remaining"
    entity_category: diagnostic
    state_class: measurement
binary_sensor:
  - platform: ups_hid
    ups_hid_id: ups_monitor
    type: voltage_out_of_range
    name: "${ups_name} Voltage Out Of Range"
    entity_category: diagnostic
    device_class: problem
  - platform: ups_hid
    ups_hid_id: ups_monitor
    type: overload
    name: "${ups_name} Output Overload"
    entity_category: diagnostic
    device_class: problem
  - platform: ups_hid
    ups_hid_id: ups_monitor
    type: over_temperature
    name: "${ups_name} Overtemperature"
    entity_category: diagnostic
    device_class: problem
  - platform: ups_hid
    ups_hid_id: ups_monitor
    type: converter_failure
    name: "${ups_name} Converter Internal Failure"
    entity_category: diagnostic
    device_class: problem
  - platform: ups_hid
    ups_hid_id: ups_monitor
    type: internal_failure
    name: "${ups_name} Summary Internal Failure"
    entity_category: diagnostic
    device_class: problem
  - platform: ups_hid
    ups_hid_id: ups_monitor
    type: shutdown_imminent
    name: "${ups_name} Shutdown Imminent"
    entity_category: diagnostic
    device_class: problem
  - platform: ups_hid
    ups_hid_id: ups_monitor
    type: replace_battery
    name: "${ups_name} Replace Battery"
    entity_category: diagnostic
    device_class: problem
  - platform: ups_hid
    ups_hid_id: ups_monitor
    type: awaiting_power
    name: "${ups_name} Awaiting Power"
    entity_category: diagnostic
  - platform: ups_hid
    ups_hid_id: ups_monitor
    type: buck
    name: "${ups_name} Buck Active"
    entity_category: diagnostic
  - platform: ups_hid
    ups_hid_id: ups_monitor
    type: boost
    name: "${ups_name} Boost Active"
    entity_category: diagnostic
  - platform: ups_hid
    ups_hid_id: ups_monitor
    type: discharging
    name: "${ups_name} Battery Discharging"
    entity_category: diagnostic
  - platform: ups_hid
    ups_hid_id: ups_monitor
    type: battery_full
    name: "${ups_name} Battery Fully Charged"
    entity_category: diagnostic
  - platform: ups_hid
    ups_hid_id: ups_monitor
    type: battery_empty
    name: "${ups_name} Battery Fully Discharged"
    entity_category: diagnostic
    device_class: problem
